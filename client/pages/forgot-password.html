<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../assets/favicon.png" />
    <link rel="stylesheet" href="../css/bootstrap.min.css" />
    <link rel="stylesheet" href="../css/all.min.css" />
    <link rel="stylesheet" href="../css/main.css" />
    <title>Narss Login</title>
  </head>
  <body>
    <main class="w-100 bg-dark" style="height: 100vh">
      <section class="h-100 d-flex justify-content-center align-items-center p-5">
        <form
          action="#"
          id="forgot-password-form"
          class="w-100 h-100 bg-white bg-opacity-90 rounded-2 d-flex flex-column align-content-center justify-content-between overflow-y-auto py-3 hide-scrollbar"
          style="max-width: 379px; max-height: 604px">
          <div class="p-4">
            <!-- Back Button -->
            <div id="go-back" class="cursor-pointer">
              <i class="fa-solid fa-arrow-left me-1 pointer-events-none"></i> Back
            </div>

            <!-- Image/Logo -->
            <div class="m-auto" style="width: 96px; height: 96px">
              <img src="../assets/favicon.png" alt="NARSS" class="w-100 h-100" />
            </div>

            <!-- Header -->
            <div class="text-center my-3">
              <p class="fs-3 fw-bold p-0 m-0" id="reset-heading">Reset Password</p>
              <p class="text-black text-opacity-75 p-0 m-0" id="reset-subheading">Enter your email to receive a secure password reset token</p>
            </div>

            <!-- Step 1: Email Input -->
            <div id="step-1-container">
              <div class="mb-3">
                <label for="email" class="fw-medium">Email Address</label>
                <div class="input">
                  <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                    placeholder="name@company.com"
                    class="form-control" />

                  <span class="left">
                    <i class="fa-solid fa-envelope"></i>
                  </span>
                </div>
              </div>

              <!-- Send Token Button -->
              <button class="btn btn-secondary w-100 rounded-3 mt-4" type="submit" id="step-1-btn">
                <span class="fw-medium">Request Reset Token</span>
                <i class="fa-solid fa-arrow-right ms-1"></i>
              </button>
            </div>

            <!-- Step 2: Token & New Password (Hidden by default) -->
            <div id="step-2-container" class="d-none">
              <div class="mb-3">
                <label for="resetToken" class="fw-medium">Reset Token</label>
                <div class="input">
                  <input
                    type="text"
                    id="resetToken"
                    name="resetToken"
                    placeholder="Enter reset token"
                    class="form-control" />
                  <span class="left">
                    <i class="fa-solid fa-key"></i>
                  </span>
                </div>
              </div>

              <div class="mb-3">
                <label for="newPassword" class="fw-medium">New Password</label>
                <div class="input">
                  <input
                    type="password"
                    id="newPassword"
                    name="newPassword"
                    placeholder="Enter new password (min 6 chars)"
                    class="form-control" />
                  <span class="left">
                    <i class="fa-solid fa-lock"></i>
                  </span>
                </div>
              </div>

              <!-- Reset Password Button -->
              <button class="btn btn-secondary w-100 rounded-3 mt-4" type="button" id="step-2-btn">
                <span class="fw-medium">Update Password</span>
                <i class="fa-solid fa-check ms-1"></i>
              </button>
            </div>
          </div>

          <!-- Don't have an account -->
          <div class="text-body-tertiary text-center">
            Already have an account?
            <a href="login.html" class="text-secondary text-decoration-none fw-medium">Login</a>
          </div>
        </form>
      </section>
    </main>
    <script src="../js/pages/forgot-password.js" type="module"></script>
    <script src="../js/temp/devTool.js" type="module">
      /*
        Controls Menu:
        Ctrl+Shift+S: setSession("temp") [Login]
        Ctrl+Shift+L: clearSession() [Logout]
      */
    </script>
  </body>
</html>
