<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../assets/favicon.png" />
    <link rel="stylesheet" href="../css/bootstrap.min.css" />
    <link rel="stylesheet" href="../css/all.min.css" />
    <link rel="stylesheet" href="../css/main.css" />
    <title>Narss Login</title>
  </head>
  <body>
    <main class="w-100 bg-dark" style="height: 100vh">
      <section class="h-100 d-flex justify-content-center align-items-center p-5">
        <form
          action="#"
          id="forgot-password-form"
          class="w-100 h-100 bg-white bg-opacity-90 rounded-2 d-flex flex-column align-content-center justify-content-between overflow-y-auto py-3 hide-scrollbar"
          style="max-width: 379px; max-height: 604px">
          <div class="p-4">
            <!-- Back Button -->
            <div id="go-back" class="cursor-pointer">
              <i class="fa-solid fa-arrow-left me-1 pointer-events-none"></i> Back
            </div>

            <!-- Image/Logo -->
            <div class="m-auto" style="width: 96px; height: 96px">
              <img src="../assets/favicon.png" alt="NARSS" class="w-100 h-100" />
            </div>

            <!-- Header -->
            <div class="text-center my-3">
              <p class="fs-3 fw-bold p-0 m-0">Reset Password</p>
              <p class="text-black text-opacity-75 p-0 m-0">Enter your email to receive a secure verification code</p>
            </div>

            <!-- Email -->
            <div class="mb-3">
              <label for="email" class="fw-medium">Email</label>
              <div class="input">
                <input
                  type="email"
                  id="email"
                  name="email"
                  autocomplete="email"
                  required
                  placeholder="name@company.com"
                  class="form-control" />

                <span class="left">
                  <i class="fa-solid fa-envelope"></i>
                </span>
              </div>
            </div>

            <!-- OTP Button -->
            <button class="btn btn-secondary w-50 d-block mx-auto rounded-3 mt-4" type="submit">
              <span class="fw-medium">Send OTP</span>
              <i class="fa-solid fa-arrow-right"></i>
            </button>
          </div>

          <!-- Don't have an account -->
          <div class="text-body-tertiary text-center">
            Already have an account?
            <a href="login.html" class="text-secondary text-decoration-none fw-medium">Login</a>
          </div>
        </form>
      </section>
    </main>
    <script src="../js/pages/forgot-password.js" type="module"></script>
    <script src="../js/temp/devTool.js" type="module">
      /*
        Controls Menu:
        Ctrl+Shift+S: setSession("temp") [Login]
        Ctrl+Shift+L: clearSession() [Logout]
      */
    </script>
  </body>
</html>
